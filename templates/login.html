{% extends "base.html" %}

{% block title %}Login | WoodCraft Access Portal{% endblock %}

{% block content %}
    <h2>Login</h2>
    <p>Sign in with your assigned demo account.</p>

    <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <p>
            <button type="submit">Log in</button>
        </p>
    </form>
{% endblock %}
